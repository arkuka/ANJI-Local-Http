<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tracking Num Record v1.2.5</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css">
    <style>
        input:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.2); }
        .flash-success { animation: flashGreen 0.4s ease-in-out; }
        .flash-error { animation: flashRed 0.4s ease-in-out; }
        @keyframes flashGreen { 0%, 100% { background-color: #f8fafc; } 50% { background-color: #dcfce7; } }
        @keyframes flashRed { 0%, 100% { background-color: #f8fafc; } 50% { background-color: #fee2e2; } }
    </style>
</head>
<body id="app-body" class="bg-slate-100 min-h-screen text-slate-800 flex flex-col p-2 select-none justify-between">

    <div class="flex-1 flex flex-col">
        <!-- 顶栏：标题 + 版本号 + 语言切换与导出按钮 -->
        <div class="flex items-center justify-between bg-white p-2.5 rounded-lg shadow-sm border border-slate-200 mb-2">
            <h1 class="font-bold text-base text-slate-800 flex items-center gap-1.5">
                <span class="inline-block w-2.5 h-2.5 rounded-full bg-blue-600"></span>
                <span id="txt-title">包裹扫描登记</span>
                <span class="text-[10px] bg-blue-100 text-blue-700 font-normal px-1.5 py-0.5 rounded ml-1">v1.2.5</span>
            </h1>
            <div class="flex items-center gap-2">
                <button onclick="toggleLanguage()" class="px-2.5 py-1 text-xs font-bold bg-slate-100 text-slate-700 rounded border border-slate-300 active:bg-slate-200">
                    <span id="txt-lang-btn">EN</span>
                </button>
                <button onclick="openExportModal()" class="px-2.5 py-1 text-xs font-bold bg-slate-100 text-slate-700 rounded border border-slate-300 active:bg-slate-200">
                    <span id="txt-export-btn">导出</span>
                </button>
            </div>
        </div>

        <!-- 扫码核心区域 -->
        <div class="bg-white p-3 rounded-lg shadow-sm border border-slate-200 flex-1 flex flex-col justify-between">
            <div class="space-y-3">
                <!-- 托盘号 -->
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1" id="lbl-pallet">托盘号 (Pallet ID)</label>
                    <input type="text" id="ipt-pallet" placeholder="扫描或输入托盘号" 
                           class="w-full h-11 px-3 text-base font-semibold bg-slate-50 border-2 border-slate-300 rounded-md uppercase focus:border-blue-600 focus:bg-white"
                           autocomplete="off">
                </div>

                <!-- 快递单号 -->
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1" id="lbl-tracking">快递单号 (Tracking Num)</label>
                    <input type="text" id="ipt-tracking" placeholder="扫描快递单号(自动提交)" 
                           class="w-full h-11 px-3 text-base font-semibold bg-slate-50 border-2 border-slate-300 rounded-md uppercase focus:border-blue-600 focus:bg-white"
                           autocomplete="off">
                </div>

                <!-- 状态提示框 -->
                <div id="status-box" class="h-10 flex items-center justify-center rounded-md text-xs font-bold text-slate-500 bg-slate-100 border border-slate-200">
                    <span id="txt-status">准备就绪，请扫描托盘号</span>
                </div>
            </div>

            <!-- 本次扫描明细 -->
            <div class="mt-3 border-t border-slate-200 pt-2">
                <div class="text-[11px] font-bold text-slate-400 mb-1 flex justify-between">
                    <span id="txt-recent-title">本次扫描明细</span>
                    <span id="scan-count" class="text-blue-600">已扫: 0</span>
                </div>
                <div id="recent-list" class="space-y-1 max-h-36 overflow-y-auto text-xs">
                </div>
            </div>
        </div>
    </div>

    <!-- 页脚：版本与更新时间 -->
    <div class="text-center text-[10px] text-slate-400 mt-2 py-1 border-t border-slate-200" id="txt-footer-version">
        版本号: <span class="font-medium text-slate-500">v1.2.5</span> | 更新时间: <span class="font-medium text-slate-500">2026-09-24 10:40</span>
    </div>

    <!-- 导出弹窗 -->
    <div id="export-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center p-3 z-50">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-xs p-4 space-y-3">
            <h3 class="font-bold text-sm text-slate-800 border-b pb-2" id="txt-modal-title">导出 Excel 记录</h3>
            
            <!-- 开始时间选择 -->
            <div>
                <label class="block text-xs text-slate-600 mb-1 font-semibold" id="lbl-start-date">开始时间</label>
                <div class="flex gap-1.5">
                    <input type="date" id="exp-start-date" class="w-2/3 h-9 px-2 text-xs border border-slate-300 rounded bg-slate-50 focus:bg-white">
                    <input type="time" id="exp-start-time" step="1" class="w-1/3 h-9 px-1 text-xs border border-slate-300 rounded bg-slate-50 focus:bg-white text-center">
                </div>
            </div>

            <!-- 结束时间选择 -->
            <div>
                <label class="block text-xs text-slate-600 mb-1 font-semibold" id="lbl-end-date">结束时间</label>
                <div class="flex gap-1.5">
                    <input type="date" id="exp-end-date" class="w-2/3 h-9 px-2 text-xs border border-slate-300 rounded bg-slate-50 focus:bg-white">
                    <input type="time" id="exp-end-time" step="1" class="w-1/3 h-9 px-1 text-xs border border-slate-300 rounded bg-slate-50 focus:bg-white text-center">
                </div>
            </div>

            <div class="flex justify-end gap-2 pt-2 border-t border-slate-100">
                <button onclick="closeExportModal()" class="px-3 py-1.5 text-xs text-slate-700 bg-slate-100 hover:bg-slate-200 rounded font-medium" id="btn-cancel">取消</button>
                <button onclick="confirmExport()" class="px-3 py-1.5 text-xs text-white bg-blue-600 hover:bg-blue-700 rounded font-bold shadow-sm" id="btn-confirm">导出 (.xlsx)</button>
            </div>
        </div>
    </div>

    <script>
        const i18n = {
            zh: {
                title: "包裹扫描登记",
                palletLabel: "托盘号 (Pallet ID)",
                palletHolder: "扫描或输入托盘号",
                trackingLabel: "快递单号 (Tracking Num)",
                trackingHolder: "扫描快递单号 (自动提交)",
                readyPallet: "准备就绪，请扫描托盘号",
                readyTracking: "扫描快递单号中...",
                scanSuccess: "保存成功！",
                recentTitle: "本次扫描明细",
                exportTitle: "导出 Excel 记录",
                startDate: "开始时间",
                endDate: "结束时间",
                cancel: "取消",
                confirm: "导出 (.xlsx)",
                exportBtn: "导出",
                langBtn: "EN",
                footerVersion: '版本号: <span class="font-medium text-slate-500">v1.2.5</span> | 更新时间: <span class="font-medium text-slate-500">2026-09-24 10:40</span>'
            },
            en: {
                title: "Parcel Scan Entry",
                palletLabel: "Pallet ID",
                palletHolder: "Scan/Enter Pallet ID",
                trackingLabel: "Tracking Number",
                trackingHolder: "Scan Tracking Num (Auto Save)",
                readyPallet: "Ready, please scan Pallet ID",
                readyTracking: "Scanning Tracking Num...",
                scanSuccess: "Saved Successfully!",
                recentTitle: "Recent Scans",
                exportTitle: "Export Excel Records",
                startDate: "Start Time",
                endDate: "End Time",
                cancel: "Cancel",
                confirm: "Export (.xlsx)",
                exportBtn: "Export",
                langBtn: "中文",
                footerVersion: 'Version: <span class="font-medium text-slate-500">v1.2.5</span> | Updated: <span class="font-medium text-slate-500">2026-09-24 10:40</span>'
            }
        };

        let currentLang = 'zh';
        let scanCounter = 0;

        const iptPallet = document.getElementById('ipt-pallet');
        const iptTracking = document.getElementById('ipt-tracking');
        const statusBox = document.getElementById('status-box');
        const txtStatus = document.getElementById('txt-status');
        const appBody = document.getElementById('app-body');
        const recentList = document.getElementById('recent-list');

        document.addEventListener('DOMContentLoaded', () => {
            resetToPalletFocus();
            
            // 初始化时间：默认起始时间设定为当天 08:00:00，结束时间为当前时刻
            const now = new Date();
            const y = now.getFullYear();
            const m = String(now.getMonth() + 1).padStart(2, '0');
            const d = String(now.getDate()).padStart(2, '0');
            
            const hh = String(now.getHours()).padStart(2, '0');
            const mm = String(now.getMinutes()).padStart(2, '0');
            const ss = String(now.getSeconds()).padStart(2, '0');

            document.getElementById('exp-start-date').value = `${y}-${m}-${d}`;
            document.getElementById('exp-start-time').value = `08:00:00`;

            document.getElementById('exp-end-date').value = `${y}-${m}-${d}`;
            document.getElementById('exp-end-time').value = `${hh}:${mm}:${ss}`;
        });

        function resetToPalletFocus() {
            iptPallet.focus();
            iptPallet.select();
        }

        iptPallet.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                const val = iptPallet.value.trim();
                if (val) {
                    iptTracking.focus();
                    setStatus(i18n[currentLang].readyTracking, 'info');
                } else {
                    setStatus(i18n[currentLang].readyPallet, 'error');
                }
            }
        });

        iptTracking.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                submitData();
            }
        });

        function submitData() {
            const palletID = iptPallet.value.trim();
            const trackingNum = iptTracking.value.trim();

            if (!palletID) {
                setStatus("请先扫描托盘号", 'error');
                resetToPalletFocus();
                triggerFlash('error');
                return;
            }

            if (!trackingNum) {
                setStatus("快递单号不能为空", 'error');
                iptTracking.focus();
                triggerFlash('error');
                return;
            }

            fetch('/anji/backend/scan_pda_api.php?action=save', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    PalletID: palletID,
                    TrackingNum: trackingNum,
                    LoadingListNum: '',
                    UserName: ''
                })
            })
            .then(res => res.json())
            .then(res => {
                if (res.status === 'success') {
                    playBeep(1000, 100); 
                    triggerFlash('success');
                    setStatus(`${i18n[currentLang].scanSuccess} (${trackingNum})`, 'success');

                    addRecordToList(res.data.PalletID, res.data.TrackingNum, res.data.TimeStamp);

                    iptPallet.value = '';
                    iptTracking.value = '';
                    resetToPalletFocus();
                } else {
                    playBeep(300, 300);
                    triggerFlash('error');
                    setStatus(res.message, 'error');
                }
            })
            .catch(err => {
                playBeep(300, 300);
                triggerFlash('error');
                setStatus("Network Error", 'error');
            });
        }

        function setStatus(msg, type) {
            txtStatus.textContent = msg;
            statusBox.className = "h-10 flex items-center justify-center rounded-md text-xs font-bold " + 
                (type === 'success' ? 'bg-green-100 text-green-700 border border-green-300' : 
                (type === 'error' ? 'bg-red-100 text-red-700 border border-red-300' : 'bg-blue-50 text-blue-700 border border-blue-200'));
        }

        function triggerFlash(type) {
            appBody.classList.remove('flash-success', 'flash-error');
            void appBody.offsetWidth;
            appBody.classList.add(type === 'success' ? 'flash-success' : 'flash-error');
        }

        function addRecordToList(pallet, tracking, time) {
            scanCounter++;
            document.getElementById('scan-count').textContent = `已扫: ${scanCounter}`;

            const row = document.createElement('div');
            row.className = "flex justify-between items-center bg-slate-50 p-1.5 rounded border border-slate-200 text-[11px]";
            row.innerHTML = `
                <div class="truncate max-w-[180px]">
                    <span class="font-bold text-slate-700">${tracking}</span>
                    <span class="text-slate-400 block text-[10px]">P: ${pallet}</span>
                </div>
                <span class="text-slate-400 text-[10px]">${time.split(' ')[1]}</span>
            `;
            recentList.prepend(row);

            if (recentList.children.length > 10) {
                recentList.removeChild(recentList.lastChild);
            }
        }

        function playBeep(freq, duration) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                osc.type = 'sine';
                osc.frequency.value = freq;
                osc.connect(ctx.destination);
                osc.start();
                setTimeout(() => { osc.stop(); ctx.close(); }, duration);
            } catch(e) {}
        }

        function toggleLanguage() {
            currentLang = currentLang === 'zh' ? 'en' : 'zh';
            const langData = i18n[currentLang];

            document.getElementById('txt-title').textContent = langData.title;
            document.getElementById('lbl-pallet').textContent = langData.palletLabel;
            iptPallet.placeholder = langData.palletHolder;
            document.getElementById('lbl-tracking').textContent = langData.trackingLabel;
            iptTracking.placeholder = langData.trackingHolder;
            document.getElementById('txt-recent-title').textContent = langData.recentTitle;
            document.getElementById('txt-modal-title').textContent = langData.exportTitle;
            document.getElementById('lbl-start-date').textContent = langData.startDate;
            document.getElementById('lbl-end-date').textContent = langData.endDate;
            document.getElementById('btn-cancel').textContent = langData.cancel;
            document.getElementById('btn-confirm').textContent = langData.confirm;
            document.getElementById('txt-lang-btn').textContent = langData.langBtn;
            document.getElementById('txt-export-btn').textContent = langData.exportBtn;
            document.getElementById('txt-footer-version').innerHTML = langData.footerVersion;

            setStatus(iptPallet.value ? langData.readyTracking : langData.readyPallet, 'info');
        }

        function openExportModal() { document.getElementById('export-modal').classList.remove('hidden'); }
        function closeExportModal() { document.getElementById('export-modal').classList.add('hidden'); }
        
        function confirmExport() {
            const startDate = document.getElementById('exp-start-date').value;
            const startTime = document.getElementById('exp-start-time').value || '08:00:00';
            const endDate = document.getElementById('exp-end-date').value;
            const endTime = document.getElementById('exp-end-time').value || '23:59:59';

            const startStr = `${startDate} ${startTime}`;
            const endStr = `${endDate} ${endTime}`;

            window.location.href = `/anji/backend/scan_pda_api.php?action=export&start=${encodeURIComponent(startStr)}&end=${encodeURIComponent(endStr)}`;
            closeExportModal();
        }
    </script>
</body>
</html>
